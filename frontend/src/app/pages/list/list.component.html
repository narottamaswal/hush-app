<div class="page-center">

    <div class="page-header">
        <div>
            <h1>my hushes</h1>
            <p class="sub" *ngIf="!loading">{{ items.length }} hush{{ items.length !== 1 ? 's' : '' }}</p>
        </div>
        <button class="btn-primary" (click)="toggleCreateForm()">
            {{ showCreateForm ? 'cancel' : '+ new item' }}
        </button>
    </div>

    <div class="create-panel" *ngIf="showCreateForm">
        <app-item-form
                [saving]="creating"
                [externalError]="createError"
                [showCancel]="true"
                (submitForm)="create($event)"
                (cancelForm)="toggleCreateForm()">
        </app-item-form>
    </div>

    <div class="state-msg" *ngIf="loading">loading...</div>

    <div class="state-msg" *ngIf="!loading && items.length === 0 && !showCreateForm">
        no items yet. click <strong>new item</strong> to create one.
    </div>

    <div class="items-list" *ngIf="!loading && items.length > 0">
        <div class="item-row" *ngFor="let item of items">

            <ng-container *ngIf="editingHash !== item.hash">
                <div class="item-info">
                    <div class="item-title-row">
                        <a [routerLink]="['/items', item.alias || item.hash]" class="item-title">{{ item.title }}</a>
                        <span class="badge" *ngIf="item.passwordProtected">🔒</span>
                    </div>
                    <p class="item-preview">{{ item.content }}</p>
                    <div class="item-meta">
                        <span class="hash-tag">{{ item.alias || item.hash }}</span>
                        <span class="dot">·</span>
                        <span>{{ formatDate(item.updatedAt) }}</span>
                    </div>
                </div>
                <div class="item-actions">
                    <button class="btn-text" (click)="startEdit(item)">edit</button>
                    <button class="btn-text danger" (click)="delete(item.hash)">delete</button>
                </div>
            </ng-container>

            <div class="inline-edit" *ngIf="editingHash === item.hash">
                <app-item-form
                        [initialData]="item"
                        [isEdit]="true"
                        [saving]="saving"
                        [externalError]="editError"
                        (submitForm)="saveEdit(item.hash, $event)"
                        (cancelForm)="cancelEdit()">
                </app-item-form>
            </div>

        </div>
    </div>
</div>
